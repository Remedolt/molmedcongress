<!DOCTYPE html>
<html lang="{{ str_replace('_', '-', app()->getLocale()) }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapım Aşamasında</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111827; /* Laravel'in sevdiği koyu tonlar */
            color: #f9fafb;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .content {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 20px;
            background: linear-gradient(to right, #ff2d20, #ff7a00); /* Laravel kırmızısı tonlarında gradyan */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Görsel Animasyon (Dişli Çark) */
        .icon-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .gear {
            font-size: 5rem;
            color: #ff2d20;
            opacity: 0.8;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Arka plan süslemesi */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 45, 32, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="content">
        <div class="icon-container">
            <div class="gear">&#9881;</div>
        </div>
        <h1>Yapım Aşamasında</h1>
    </div>

</body>
</html>
