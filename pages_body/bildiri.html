<section class="page is-active" id="page-bildiri">
<section class="page-hero"><div class="container"><div class="eyebrow" data-i18n="nav_bildiri"></div><h1 data-i18n="bildiri_title"></h1><div class="breadcrumb"><a href="index.html" data-i18n="nav_home"></a> / <span data-i18n="nav_bildiri"></span></div></div></section>
  <section class="section">
    <div class="container">
      <p style="max-width:760px;margin:0 auto 32px;" data-i18n="bildiri_intro"></p>
      <div class="section-head reveal" style="margin-bottom:28px;">
        <div class="eyebrow" data-i18n="bildiri_steps_title"></div>
      </div>
      <div class="grid grid--4 reveal" style="margin-bottom:40px;">
        <div class="card card--step"><div class="step-num">1</div><div class="icon"><span class="ic" data-icon="file" data-size="23"></span></div><h3 data-i18n="bildiri_step1_title"></h3><p data-i18n="bildiri_step1_body"></p></div>
        <div class="card card--step"><div class="step-num">2</div><div class="icon"><span class="ic" data-icon="mail" data-size="23"></span></div><h3 data-i18n="bildiri_step2_title"></h3><p data-i18n="bildiri_step2_body"></p></div>
        <div class="card card--step"><div class="step-num">3</div><div class="icon"><span class="ic" data-icon="users" data-size="23"></span></div><h3 data-i18n="bildiri_step3_title"></h3><p data-i18n="bildiri_step3_body"></p></div>
        <div class="card card--step"><div class="step-num">4</div><div class="icon"><span class="ic" data-icon="award" data-size="23"></span></div><h3 data-i18n="bildiri_step4_title"></h3><p data-i18n="bildiri_step4_body"></p></div>
      </div>
      <div class="form-card" style="max-width:900px;margin:0 auto;">
        <div id="bildiriFormWrap">
          <form id="bildiriForm" novalidate>
            <div class="form-grid">
              <div class="field full"><label data-i18n="form_abstract_title"></label><input type="text" name="title" required></div>
              <div class="field full"><label data-i18n="form_abstract_authors"></label><input type="text" name="authors" required></div>
              <div class="field"><label data-i18n="form_abstract_institution"></label><input type="text" name="institution" required></div>
              <div class="field"><label data-i18n="form_abstract_topic"></label><input type="text" name="topic"></div>
              <div class="field"><label data-i18n="form_abstract_corr_email"></label><input type="email" name="email" required></div>
              <div class="field"><label data-i18n="form_abstract_corr_phone"></label><input type="tel" name="phone" required></div>
              <div class="field full">
                <label data-i18n="form_abstract_category"></label>
                <div class="radio-group">
                  <label><input type="radio" name="category" value="oral" required> <span data-i18n="form_abstract_category_oral"></span></label>
                  <label><input type="radio" name="category" value="poster"> <span data-i18n="form_abstract_category_poster"></span></label>
                  <label><input type="radio" name="category" value="either"> <span data-i18n="form_abstract_category_either"></span></label>
                </div>
              </div>
              <div class="field full"><label data-i18n="form_abstract_text"></label><textarea name="abstract_text" required style="min-height:200px;"></textarea></div>
              <div class="field full"><label data-i18n="form_abstract_file"></label><input type="file" name="attachment" accept=".pdf,.doc,.docx"></div>
            </div>
            <p class="field-help" style="margin-top:16px;" data-i18n="form_required_note"></p>
            <button class="btn btn--primary btn--block" type="submit" style="margin-top:10px;"><span class="ic" data-icon="file" data-size="18"></span> <span data-i18n="form_submit_abstract"></span></button>
            <div class="preview-note" data-i18n="preview_form_note"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
</section>
